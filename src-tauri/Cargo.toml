[package]
name = "proxypilot-app"
description = "ProxyPilot 代理分流助手"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxypilot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.2", features = [] }

[dependencies]
proxypilot-core = { path = "../crates/proxypilot-core" }
# Kept on the same minor line as @tauri-apps/api and @tauri-apps/cli in package.json.
tauri = { version = "~2.12.2", features = ["tray-icon"] }
tauri-plugin-opener = "~2.7.1"
tauri-plugin-dialog = "~2.8.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "~2.14.0"
# Not used directly: turns on SOCKS support in the updater's reqwest, so
# update checks can go through the user's SOCKS5 proxy client.
reqwest = { version = "0.13.5", default-features = false, features = ["socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
